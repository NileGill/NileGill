<svg fill="none" viewBox="0 0 600 100" width="600" height="100" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        @keyframes colorgradient {
            0%{
                background-position: 0% 50%;
            }
            50%{
                background-position: 100% 50%;
            }
            100%{
                background-position: 0% 50%;
            }
        }
        .title {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; /* font stack list in order of prefrence from what is installed */
            display: flex;
            width: 100%;
            height: 100px;
            /* background-color: black; */
            align-items: center; /* vertical alignment */
            justify-content: center; /* horizontal alignment */
        }
        .title h1 {
            background: linear-gradient(-45deg, #b5b5b5, #c9c9c9, #c9c9c9, #ffffff);
            background-size: 400% 400%;
            animation: colorgradient 15s ease infinite;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        @media (prefers-reduced-motion: reduce) {
            .title h1 {
                animation: none;
            }
        }
      </style>

      <div class="title">
        <h1>Hello, Bonjour, ਸਤ ਸ੍ਰੀ ਅਕਾਲ</h1>
      </div>
    </div>
  </foreignObject>
</svg>