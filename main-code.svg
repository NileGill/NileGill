<svg fill="none" viewBox="0 0 830 500" width="830" height="500" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        @keyframes colorgradient {
            0%{
                background-position: 0% 50%;
            }
            50%{
                background-position: 100% 50%;
            }
            100%{
                background-position: 0% 50%;
            }
        }
        .header {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; /* font stack list in order of prefrence from what is installed */
            display: flex;
            width: 100%;
            height: 60px;
            font-size: 10px;
            /* background-color: black; */
            align-items: center; /* vertical alignment */
            justify-content: center; /* horizontal alignment */
        }
        .title {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            width: 100%;
            height: 80px;
            font-size: 30px;
            align-items: center;
            justify-content: center;
        }
        .header h1 {
            background: linear-gradient(-45deg, #7e807f, #b5b5b5, #636363, #919191);
            background-size: 400% 400%;
            animation: colorgradient 15s ease infinite;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .title h1 {
            background: linear-gradient(-45deg, #b5b5b5, #c9c9c9, #c9c9c9, #ffffff);
            background-size: 400% 400%;
            animation: colorgradient 15s ease infinite;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .content {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            width: 100%;
            height: 300px;
            font-size: 20px;
            color: white;
            margin-inline-start: 20px;
        }
      </style>

      <div class="header">
        <h1>*None of this is made with AI*</h1>
      </div>
      <div class="title">
        <h1>Hello, Bonjour, ਸਤ ਸ੍ਰੀ ਅਕਾਲ</h1>
      </div>
      <div class="content">
        <p>
          • Currently learning Java <img src="data:image/svg+xml;base64," width="25" height="25"/>
          , HTML <img src="data:image/svg+xml;base64," width="25" height="25" style="position: relative; top: 5px;"/>
          , CSS  <img src="data:image/svg+xml;base64," width="25" heigth="25" style="position: relative; top: 5px;"/>
        </p>
      </div>
    </div>
  </foreignObject>
</svg>