<svg fill="none" viewBox="0 0 830 100" width="830" height="100" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        @keyframes colorgradient {
            0%{
                background-position: 0% 50%;
            }
            50%{
                background-position: 100% 50%;
            }
            100%{
                background-position: 0% 50%;
            }
        }
        .header {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; /* font stack list in order of prefrence from what is installed */
            display: flex;
            width: 100%;
            height: 100px;
            /* background-color: black; */
            align-items: center; /* vertical alignment */
            justify-content: center; /* horizontal alignment */
        }
        .header h1 {
            background: linear-gradient(-45deg, #7e807f, #b5b5b5, #636363, #919191);
            background-size: 400% 400%;
            animation: colorgradient 15s ease infinite;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        @media (prefers-reduced-motion: reduce) {
            .header h1 {
                animation: none;
            }
        }
      </style>

      <div class="header">
        <h1>*None of this is made with AI*</h1>
      </div>
    </div>
  </foreignObject>
</svg>